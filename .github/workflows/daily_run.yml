name: SRP Auto Crawler

on:
  schedule:
    # 每天午夜 00:00 執行 (UTC 時間)
    - cron: '0 0 * * *'
  # 允許手動點擊按鈕執行
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas lxml requests
          playwright install chromium

      - name: Run Crawler Script
        # 注意：這裡的 ${{ }} 前面絕對沒有 $ 符號
        run: python -u Cloud_track_url_v1.py
