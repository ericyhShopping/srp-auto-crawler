name: SRP Auto Crawler

on:
  schedule:
    - cron: '0 0 * * *'  # 每天午夜執行
  workflow_dispatch:      # 允許手動執行

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas lxml requests
          playwright install chromium

      - name: Run Crawler Script
        # --- 這裡就是將 Secrets 餵給 Python 的地方 ---
        env:
          GSHEET_INPUT_URL: ${{ secrets.GSHEET_INPUT_URL }}
          GAS_OUTPUT_URL: ${{ secrets.GAS_OUTPUT_URL }}
        run: python Cloud_track_url_v1.py  # 請確保這裡的檔名跟你的 .py 檔名一樣
