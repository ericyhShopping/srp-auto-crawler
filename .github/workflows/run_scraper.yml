name: Cloud Track URL

# 設定觸發時機
on:
  schedule:
    # 💡 每天 UTC 00:00 (台北時間早上 08:00) 自動執行一次
    # 這樣設定最省時數，能完美確保新帳號的 2,000 分鐘撐過整個月
    - cron: '0 0 * * *'
  
  # 允許你在 GitHub 網頁上手動點擊 "Run workflow" 觸發測試
  workflow_dispatch:

# 任務設定
jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 複製專案程式碼到虛擬機
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 啟用快取機制，加速後續安裝

      # Step 3: 安裝自動化必備套件 (Playwright, pandas, lxml 等)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas lxml requests
          # 如果你有使用 playwright-stealth，取消下方註解：
          # pip install playwright-stealth

      # Step 4: 安裝 Chromium 瀏覽器核心
      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      # Step 5: 執行爬蟲主程式，並安全注入 Secrets 變數
      - name: Run Scraper Script
        env:
          # 💡 將儲存在 GitHub 專案內部的 Secrets 映射成 Python 看得到的環境變數
          GSHEET_INPUT_URL: ${{ secrets.GSHEET_INPUT_URL }}
          GAS_OUTPUT_URL: ${{ secrets.GAS_OUTPUT_URL }}
          TRACK_URL_DATA_CSV: ${{ secrets.TRACK_URL_DATA_CSV }}
        run: |
          python Cloud_track_url_v1.py
