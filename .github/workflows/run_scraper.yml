name: Hourly Retailer Scraper

on:
  schedule:
    # 💡 設定每小時執行一次 (UTC 時間 0 分時觸發)
   - cron: '0 0 * * *'  # 每天台北時間早上 8 點執行一次
  workflow_dispatch: # 💡 允許手動點擊按鈕執行

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          # 💡 只安裝必要的 Chromium 瀏覽器及其系統相依套件
          python -m playwright install chromium --with-deps

      - name: Run Scraper
        run: python Cloud_track_url_v1.py
        env:
          # 如果你有任何隱私變數可以放在這裡
          PYTHONUNBUFFERED: 1
